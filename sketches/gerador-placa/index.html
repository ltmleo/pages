<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de placa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Italianno&family=Dancing+Script:wght@500&family=Playfair+Display:ital@1&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4efe6;color:#3b2a20}
    main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
    @media(min-width:860px){main{grid-template-columns:320px 1fr;align-items:start}}
    .panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0002}
    label{display:block;font-weight:600;margin:12px 0 4px;font-size:13px}
    textarea,select,input[type=number]{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;font:inherit}
    textarea{min-height:90px;resize:vertical}
    input[type=range]{width:100%}
    .row{display:flex;gap:8px;align-items:center}
    .row>*{flex:1}
    input[type=color]{width:100%;height:36px;border:1px solid #ccc;border-radius:8px;padding:2px;background:#fff}
    .themes{display:flex;gap:8px;flex-wrap:wrap}
    .themes button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;outline:1px solid #bbb;cursor:pointer}
    .themes button.on{outline:2px solid #3b2a20}
    #save{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:#5a2a14;color:#fff;font:600 16px system-ui;cursor:pointer}
    canvas{width:100%;height:auto;border-radius:8px;box-shadow:0 2px 10px #0003;background:#fff;display:block}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <label for="text">Texto (Enter = nova linha)</label>
    <textarea id="text">Chá de Bebê
da Laura</textarea>

    <label>Tema de fundo</label>
    <div class="themes" id="themes"></div>
    <div class="row" style="margin-top:8px">
      <div><label for="cBg" style="margin-top:0">Xadrez</label><input type="color" id="cBg"></div>
      <div><label for="cFrame" style="margin-top:0">Moldura</label><input type="color" id="cFrame"></div>
      <div><label for="cText" style="margin-top:0">Texto</label><input type="color" id="cText" value="#5a2a14"></div>
    </div>

    <label for="font">Fonte</label>
    <select id="font">
      <option>Great Vibes</option><option>Italianno</option><option>Dancing Script</option>
      <option>Playfair Display</option><option>Cormorant Garamond</option>
    </select>

    <label for="size">Tamanho do texto: <span id="sizeV"></span></label>
    <input type="range" id="size" min="50" max="300" value="190">

    <label for="layout">Enfeites</label>
    <select id="layout">
      <option value="0">Patinhos + borboletas</option>
      <option value="1">Borboletas + 1 patinho</option>
      <option value="2">Laço + flores + patinho</option>
      <option value="3">2 patinhos + borboletas (topo)</option>
      <option value="4">Sem enfeites</option>
    </select>

    <label style="display:flex;gap:8px;align-items:center;font-weight:400;flex-wrap:nowrap">
      <input type="checkbox" id="useImg" checked style="width:auto"> Usar imagens de img/ (se existirem)
    </label>
    <div id="imgStatus" style="font-size:12px;color:#7a6a5c;margin-top:2px"></div>

    <label for="fmt">Formato</label>
    <select id="fmt">
      <option value="1800x1200">3:2 (1800×1200)</option>
      <option value="1754x1240">A4 paisagem (150 dpi)</option>
      <option value="1400x1400">Quadrado</option>
    </select>

    <button id="save">Salvar PNG</button>
  </section>
  <section><canvas id="c"></canvas></section>
</main>

<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d');

const THEMES = [
  { n:'Rosa',    bg:'#e98aa9', frame:'#a9b99a' },
  { n:'Verde',   bg:'#7fb27a', frame:'#f2c9d3' },
  { n:'Azul',    bg:'#7fa8d6', frame:'#b9c9a8' },
  { n:'Amarelo', bg:'#e8c456', frame:'#a9b99a' },
  { n:'Lilás',   bg:'#b79ad6', frame:'#a9b99a' },
];

// [tipo, x(frac), y(frac), tamanho, rotação°, espelhar]
const LAYOUTS = [
  [['bf',.08,.13,.8,-15],['bf',.89,.14,1.2,10],['duck',.14,.97,1,0,1],['duck',.86,.97,1,0,0],['flowers',.23,.9,.8],['bf',.7,.86,.7,-10]],
  [['bf',.9,.14,1.1,12],['bf',.1,.82,1.2,-10],['duck',.86,.97,1,0,0]],
  [['bow',.5,.15,1.05],['flowers',.88,.12,1],['duck',.14,.97,1,0,1],['bf',.9,.88,.9,-8]],
  [['bf',.1,.13,1,-10],['bf',.9,.14,1,10],['duck',.14,.97,1,0,1],['duck',.86,.97,1,0,0]],
  [],
];

/* ---------- utilidades ---------- */
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;
}
function shade(hex, f){ // f<0 escurece
  const n = parseInt(hex.slice(1), 16);
  const m = v => Math.max(0, Math.min(255, Math.round(v + 255*f)));
  return `rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`;
}

/* ---------- fundo, moldura ---------- */
function gingham(W, H, u, color){
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = rgba(color, .38);
  const t = 60*u;
  for (let x = 0; x < W; x += 2*t) ctx.fillRect(x, 0, t, H);
  for (let y = 0; y < H; y += 2*t) ctx.fillRect(0, y, W, t);
}
function frame(W, H, u, color){
  const m = 105*u, x0 = m, y0 = m, x1 = W-m, y1 = H-m, r = 17*u;
  ctx.fillStyle = color;
  ctx.fillRect(x0, y0, x1-x0, y1-y0);
  const step = r*1.8;
  const circ = (x, y) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
  for (let x = x0; x <= x1; x += step){ circ(x, y0); circ(x, y1); }
  for (let y = y0; y <= y1; y += step){ circ(x0, y); circ(x1, y); }
  // pontilhado
  ctx.save();
  ctx.setLineDash([1, 11*u]); ctx.lineCap = 'round'; ctx.lineWidth = 4*u;
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  const d = 26*u; ctx.strokeRect(x0+d, y0+d, x1-x0-2*d, y1-y0-2*d);
  ctx.restore();
  // painel creme
  const p = 52*u;
  ctx.fillStyle = '#fbf8ee';
  ctx.strokeStyle = shade(color, -.12); ctx.lineWidth = 3*u;
  ctx.beginPath(); ctx.roundRect(x0+p, y0+p, x1-x0-2*p, y1-y0-2*p, 8*u); ctx.fill(); ctx.stroke();
}

/* ---------- enfeites ---------- */
function butterfly(){
  const wing = (up) => {
    ctx.beginPath();
    if (up){ ctx.moveTo(0,0); ctx.bezierCurveTo(10,-40,60,-58,72,-26); ctx.bezierCurveTo(80,-4,40,10,0,0); }
    else   { ctx.moveTo(0,0); ctx.bezierCurveTo(30,5,58,20,46,48); ctx.bezierCurveTo(34,62,6,36,0,0); }
    const g = ctx.createLinearGradient(0,0,70,-30);
    g.addColorStop(0,'#f6c85a'); g.addColorStop(1,'#fbe29a');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#c9983a'; ctx.lineWidth = 2; ctx.stroke();
  };
  for (const s of [1,-1]){ ctx.save(); ctx.scale(s,1); wing(true); wing(false); ctx.restore(); }
  ctx.fillStyle = '#6b4a2a';
  ctx.beginPath(); ctx.ellipse(0,5,4,22,0,0,7); ctx.fill();
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.quadraticCurveTo(-8,-34,-16,-36);
  ctx.moveTo(0,-14); ctx.quadraticCurveTo(8,-34,16,-36); ctx.stroke();
}
function flower(x, y, r){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#f4b9cb'; ctx.strokeStyle = '#e08aa6'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++){
    ctx.save(); ctx.rotate(i*Math.PI*2/5);
    ctx.beginPath(); ctx.ellipse(0, -r*.62, r*.45, r*.62, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#f7d27a'; ctx.beginPath(); ctx.arc(0,0,r*.3,0,7); ctx.fill();
  ctx.restore();
}
function flowers(){
  ctx.fillStyle = '#9fb88a'; ctx.strokeStyle = '#7f9a6c'; ctx.lineWidth = 2;
  for (const [x,y,a] of [[-70,10,-.9],[70,5,.9],[-30,-40,-.3],[40,-45,.4]]){
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.beginPath(); ctx.ellipse(0,-20,10,26,0,0,7); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  flower(-40, 0, 26); flower(30, -20, 30); flower(0, 28, 22);
}
function bowShape(fill, stroke, tails){
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  if (tails){
    for (const s of [1,-1]){
      ctx.save(); ctx.scale(s,1);
      ctx.beginPath(); ctx.moveTo(6,8); ctx.quadraticCurveTo(30,40,26,70); ctx.lineTo(14,60); ctx.lineTo(4,72); ctx.lineTo(0,10);
      ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }
  for (const s of [1,-1]){
    ctx.save(); ctx.scale(s,1);
    ctx.beginPath(); ctx.moveTo(4,0); ctx.bezierCurveTo(30,-40,80,-38,84,-4); ctx.bezierCurveTo(80,28,30,22,4,4);
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.beginPath(); ctx.ellipse(0,2,13,15,0,0,7); ctx.fill(); ctx.stroke();
}
function bow(){ bowShape('#f6cfda', '#e3a3b6', true); }
function duck(){
  const cream = '#fcf6e8', line = '#cdb594';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // pernas e pés
  ctx.strokeStyle = '#e48c3e'; ctx.fillStyle = '#ee9d50'; ctx.lineWidth = 9;
  for (const x of [-22, 24]){
    ctx.beginPath(); ctx.moveTo(x,-30); ctx.lineTo(x,-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+8,-8); ctx.quadraticCurveTo(x-14,-20,x-40,0); ctx.quadraticCurveTo(x-16,12,x+8,6); ctx.closePath(); ctx.fill();
  }
  // silhueta única: cabeça, pescoço, peito, barriga, cauda
  ctx.beginPath();
  ctx.moveTo(-118,-250);
  ctx.bezierCurveTo(-112,-278,-78,-288,-60,-268);
  ctx.bezierCurveTo(-46,-250,-54,-226,-52,-204);
  ctx.bezierCurveTo(-50,-172,-18,-156,32,-164);
  ctx.bezierCurveTo(70,-170,100,-180,134,-196);
  ctx.bezierCurveTo(140,-160,142,-130,118,-96);
  ctx.bezierCurveTo(98,-44,44,-26,-8,-26);
  ctx.bezierCurveTo(-74,-26,-122,-60,-116,-108);
  ctx.bezierCurveTo(-112,-138,-94,-152,-92,-178);
  ctx.bezierCurveTo(-90,-202,-120,-216,-118,-250);
  ctx.closePath();
  const g = ctx.createLinearGradient(0,-280,0,-30);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#f3e6cd');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = line; ctx.lineWidth = 3.5; ctx.stroke();
  // asa
  ctx.beginPath();
  ctx.moveTo(-22,-128);
  ctx.bezierCurveTo(24,-152,92,-148,116,-118);
  ctx.bezierCurveTo(96,-78,34,-66,-8,-92);
  ctx.bezierCurveTo(-26,-104,-28,-118,-22,-128);
  ctx.fillStyle = '#f3e6cf'; ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2.5;
  for (const [x,y,x2,y2] of [[10,-112,60,-118],[4,-98,52,-100],[-4,-86,38,-84]]){
    ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo((x+x2)/2,y-8,x2,y2); ctx.stroke();
  }
  // bico
  ctx.fillStyle = '#ee9d50'; ctx.strokeStyle = '#d4812f'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-116,-258); ctx.quadraticCurveTo(-140,-262,-160,-246);
  ctx.quadraticCurveTo(-140,-232,-118,-236); ctx.closePath(); ctx.fill(); ctx.stroke();
  // olho e bochecha
  ctx.fillStyle = 'rgba(240,150,170,.45)'; ctx.beginPath(); ctx.ellipse(-84,-238,11,8,0,0,7); ctx.fill();
  ctx.fillStyle = '#4a3322'; ctx.beginPath(); ctx.arc(-96,-254,4.8,0,7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-97.5,-255.5,1.4,0,7); ctx.fill();
  // laço de xadrez no pescoço
  ctx.save(); ctx.translate(-70,-192); ctx.rotate(.12); ctx.scale(.5,.5);
  bowShape('#f0b3c6','#cf87a0',false); ctx.restore();
}

const DRAW = { bf: butterfly, duck, bow, flowers };

/* ---------- sprites (PNG/JPG/WebP com fundo verde ou azul) ---------- */
// key: 'g' = fundo verde #00FF00, 'b' = fundo azul #0000FF.  w/h = tamanho base (px a 1200 de altura)
const SPRITES = {
  duck:    { f:'goose',     key:'g', h:435, bottom:true },
  bf:      { f:'butterfly', key:'g', w:255 },
  flowers: { f:'flowers',   key:'b', w:330 },
  bow:     { f:'bow',       key:'g', w:285 },
};
const SP = {};
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

// remove o fundo (verde 'g' ou azul 'b'); devolve pixels RGBA
function keyFull(img, key){
  const w = img.naturalWidth, h = img.naturalHeight;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d', { willReadFrequently:true }); x.drawImage(img, 0, 0);
  const p = x.getImageData(0, 0, w, h).data;
  for (let i = 0; i < p.length; i += 4){
    const r = p[i], g = p[i+1], b = p[i+2];
    const d = key === 'g' ? g - Math.max(r, b) : b - Math.max(r, g);   // quão "verde/azul" é o pixel
    const a = d >= 70 ? 0 : d <= 25 ? 1 : (70 - d) / 45;               // borda suave
    if (d > 0){ if (key === 'g') p[i+1] = Math.max(r, b); else p[i+2] = Math.max(r, g); } // remove vazamento da cor
    p[i+3] = Math.round(p[i+3] * a);
  }
  return { w, h, p };
}
// cria canvas a partir de RGBA, recortado ao conteúdo; keep(x,y) filtra pixels
function toSprite(w, h, p, box, keep){
  const [bx0, by0, bx1, by1] = box;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  const bw = bx1-bx0+1, bh = by1-by0+1, q = new Uint8ClampedArray(bw*bh*4);
  for (let y = by0; y <= by1; y++) for (let x = bx0; x <= bx1; x++){
    const i = (y*w+x)*4, o = ((y-by0)*bw + (x-bx0))*4;
    if (p[i+3] <= 25 || (keep && !keep(x, y))) continue;
    q[o]=p[i]; q[o+1]=p[i+1]; q[o+2]=p[i+2]; q[o+3]=p[i+3];
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return null;
  const cv = document.createElement('canvas'); cv.width = bw; cv.height = bh;
  cv.getContext('2d').putImageData(new ImageData(q, bw, bh), 0, 0);
  const out = document.createElement('canvas'); out.width = x1-x0+1; out.height = y1-y0+1;
  out.getContext('2d').drawImage(cv, x0-bx0, y0-by0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}
function keyOut(img, key){
  const { w, h, p } = keyFull(img, key);
  return toSprite(w, h, p, [0, 0, w-1, h-1]);
}

// Folha única (fundo azul), grade 2x2: ganso | laço / flores | borboletas
function sliceSheet(img){
  const { w, h, p } = keyFull(img, 'b');
  const sc = Math.min(1, 400 / Math.max(w, h)), mw = Math.ceil(w*sc), mh = Math.ceil(h*sc);
  let m = new Uint8Array(mw*mh);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (p[(y*w+x)*4+3] > 25) m[((y*sc)|0)*mw + ((x*sc)|0)] = 1;
  const R = 2, dm = new Uint8Array(m.length);                         // dilata p/ unir partes próximas
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (m[y*mw+x])
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++){
      const X = x+dx, Y = y+dy; if (X >= 0 && Y >= 0 && X < mw && Y < mh) dm[Y*mw+X] = 1;
    }
  const lab = new Int32Array(mw*mh), comps = [];                      // componentes conexos
  for (let s0 = 0; s0 < dm.length; s0++){
    if (!dm[s0] || lab[s0]) continue;
    const id = comps.length + 1, st = [s0]; lab[s0] = id;
    const c = { id, area:0, sx:0, sy:0, x0:mw, y0:mh, x1:0, y1:0 };
    while (st.length){
      const n = st.pop(), x = n % mw, y = (n / mw) | 0;
      c.area++; c.sx += x; c.sy += y;
      if (x < c.x0) c.x0 = x; if (x > c.x1) c.x1 = x; if (y < c.y0) c.y0 = y; if (y > c.y1) c.y1 = y;
      for (const k of [n-1, n+1, n-mw, n+mw]){
        if (k < 0 || k >= dm.length || !dm[k] || lab[k]) continue;
        if ((k === n-1 && x === 0) || (k === n+1 && x === mw-1)) continue;
        lab[k] = id; st.push(k);
      }
    }
    comps.push(c);
  }
  const big = comps.filter(c => c.area > mw*mh*0.002);                // descarta pontinhos
  const cell = c => (c.sx/c.area < mw/2 ? 0 : 1) + (c.sy/c.area < mh/2 ? 0 : 2); // 0 ganso,1 laço,2 flores,3 borboletas
  const build = list => {
    const ids = new Set(list.map(c => c.id));
    const box = [Math.max(0, Math.floor(Math.min(...list.map(c => c.x0))/sc) - 2),
                 Math.max(0, Math.floor(Math.min(...list.map(c => c.y0))/sc) - 2),
                 Math.min(w-1, Math.ceil((Math.max(...list.map(c => c.x1))+1)/sc) + 2),
                 Math.min(h-1, Math.ceil((Math.max(...list.map(c => c.y1))+1)/sc) + 2)];
    return toSprite(w, h, p, box, (x, y) => ids.has(lab[((y*sc)|0)*mw + ((x*sc)|0)]));
  };
  const out = {}, names = ['duck','bow','flowers'];
  names.forEach((t, i) => { const l = big.filter(c => cell(c) === i); if (l.length) out[t] = [build(l)]; });
  let bf = big.filter(c => cell(c) === 3).sort((a, b) => b.area - a.area);
  if (bf.length) bf = bf.filter(c => c.area >= bf[0].area*0.25).slice(0, 4).sort((a, b) => a.sx/a.area - b.sx/b.area);
  if (bf.length) out.bf = bf.map(c => build([c]));
  return out;
}

async function loadFirst(base){
  for (const ext of ['png','webp','jpg']){ const img = await loadImg(`img/${base}.${ext}`); if (img) return img; }
  return null;
}
async function loadSprites(){
  const nm = { duck:'ganso', bow:'laço', flowers:'flores', bf:'borboleta(s)' }, ok = [];
  try {
    const sheet = await loadFirst('sheet');
    if (sheet) for (const [t, l] of Object.entries(sliceSheet(sheet))) if (l.every(Boolean)) SP[t] = l;
  } catch(e){ console.warn(e); }
  for (const [type, d] of Object.entries(SPRITES)){                   // arquivo individual tem prioridade
    const img = await loadFirst(d.f);
    if (!img) continue;
    try { const k = keyOut(img, d.key); if (k) SP[type] = [k]; } catch(e){ /* canvas bloqueado (file://) */ }
  }
  for (const t of Object.keys(nm)) if (SP[t]) ok.push(nm[t] + (SP[t].length > 1 ? ' ×' + SP[t].length : ''));
  const miss = Object.keys(nm).filter(t => !SP[t]).map(t => nm[t]);
  $('imgStatus').textContent = ok.length
    ? `Imagens: ${ok.join(', ')}` + (miss.length ? ` · faltando (vetorial): ${miss.join(', ')}` : '')
    : 'Nenhuma imagem em img/ — usando desenhos vetoriais.';
}

/* ---------- render ---------- */
async function render(){
  const [W, H] = $('fmt').value.split('x').map(Number);
  c.width = W; c.height = H;
  const u = H / 1200;
  const font = $('font').value;
  try { await document.fonts.load(`100px "${font}"`); } catch(e){}

  gingham(W, H, u, $('cBg').value);
  frame(W, H, u, $('cFrame').value);

  // enfeites
  const used = {};
  for (const [type, fx, fy, sz, rot = 0, flip = 0] of LAYOUTS[$('layout').value]){
    ctx.save();
    ctx.translate(fx*W, fy*H);
    const lst = $('useImg').checked && SP[type], spr = lst && lst[(used[type] = (used[type] ?? -1) + 1) % lst.length];
    if (spr){
      const d = SPRITES[type], k = (d.w ? d.w / spr.width : d.h / spr.height) * sz * u;
      ctx.scale(flip ? -1 : 1, 1);
      ctx.rotate(rot*Math.PI/180);
      const w = spr.width*k, h = spr.height*k;
      ctx.drawImage(spr, -w/2, d.bottom ? -h : -h/2, w, h);
    } else {
      const k = sz * u * (type === 'duck' ? 1.45 : 1.7);
      ctx.scale(flip ? -k : k, k);
      ctx.rotate(rot*Math.PI/180);
      DRAW[type]();
    }
    ctx.restore();
  }

  // texto (auto-ajuste à largura útil)
  const lines = $('text').value.split('\n');
  let fs = +$('size').value * u;
  const maxW = W * .56, maxH = H * .62;
  const measure = () => { ctx.font = `${fs}px "${font}", cursive`; return Math.max(...lines.map(l => ctx.measureText(l).width), 1); };
  let w = measure();
  if (w > maxW){ fs *= maxW / w; w = measure(); }
  const lh = fs * 1.18;
  if (lh*lines.length > maxH){ fs *= maxH / (lh*lines.length); measure(); }
  const lh2 = fs * 1.18, total = lh2 * lines.length;
  ctx.fillStyle = $('cText').value; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W/2, H/2 - total/2 + lh2*(i+.5)));
  $('sizeV').textContent = Math.round(fs/u);
}

/* ---------- UI ---------- */
function setTheme(i){
  $('cBg').value = THEMES[i].bg; $('cFrame').value = THEMES[i].frame;
  document.querySelectorAll('#themes button').forEach((b, j) => b.classList.toggle('on', i === j));
  render();
}
THEMES.forEach((t, i) => {
  const b = document.createElement('button');
  b.title = t.n; b.style.background = `linear-gradient(135deg,${t.bg} 55%,${t.frame} 55%)`;
  b.onclick = () => setTheme(i);
  $('themes').appendChild(b);
});
['text','font','size','layout','fmt','cBg','cFrame','cText','useImg'].forEach(id => $(id).addEventListener('input', render));
$('save').onclick = () => c.toBlob(b => {
  const a = document.createElement('a');
  const slug = ($('text').value.split('\n')[0] || 'placa').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'placa';
  a.href = URL.createObjectURL(b); a.download = `placa-${slug}.png`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}, 'image/png');

setTheme(0);
document.fonts.ready.then(render);
loadSprites().then(render);
</script>
</body>
